<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">CC Env · Claude 网络检测</title>
  <desc id="desc">浏览器向 Claude 站点发起请求。把报告生成的提示词复制到本机终端，交给 Agent 复查。</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.25" fill="#394246"/>
    </pattern>
    <g id="window-dots" fill="#9ca9a5"><circle cx="0" cy="0" r="3"/><circle cx="11" cy="0" r="3"/><circle cx="22" cy="0" r="3"/></g>
  </defs>
  <rect width="1200" height="330" fill="#161b1d" rx="18"/>
  <rect x="550" width="640" height="325" fill="url(#dots)"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="100" fill="#f6f1e6" font-size="68" font-weight="740" letter-spacing="-4">CC Env</text>
    <text x="60" y="165" fill="#f6f1e6" font-size="37" font-weight="600">Claude 网络检测</text>
    <path d="M60 207h64" stroke="#ffa47f" stroke-width="4"/>
    <text x="60" y="254" fill="#c8d0cc" font-size="23">浏览器测连接，终端查原因。</text>
  </g>
  <g id="browser" transform="translate(552 42)">
    <rect width="344" height="176" rx="12" fill="#22292b" stroke="#77847f" stroke-width="2"/>
    <path d="M1 38h342" stroke="#677371"/>
    <use href="#window-dots" x="17" y="19"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#e7eee8">
      <text x="28" y="76">claude.ai</text><text x="28" y="112">api.anthropic.com</text><text x="28" y="148">platform.claude.com</text>
    </g>
  </g>
  <g id="handoff" fill="none" stroke="#ffa47f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M910 82h77q18 0 18 18v28m-9-9 9 10 9-10"/>
  </g>
  <g id="terminal" transform="translate(848 145)">
    <rect width="299" height="143" rx="10" fill="#f3efe5"/>
    <text x="23" y="39" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#34413e">›_  Local Agent</text>
    <path d="M22 55h253" stroke="#c4c7bc"/>
    <text x="23" y="92" font-family="system-ui, 'PingFang SC', sans-serif" font-size="23" font-weight="600" fill="#1a2523">粘贴排查提示词</text>
    <path d="M24 115h91m8 0h52" stroke="#b5bcb0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
