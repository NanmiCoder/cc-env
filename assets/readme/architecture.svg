<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CC Env Diagnostic Architecture</title>
  <desc id="arch-desc">Three-stage diagnostic pipeline: Browser Client Probes and Cloudflare Pages Edge Inspection feed into the Risk Engine to output a 100-point score, CLI env config, and Agent repair prompt.</desc>

  <rect width="1200" height="360" rx="20" fill="#0B0B0D"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Header -->
  <text x="48" y="44" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">DIAGNOSTIC PIPELINE · ARCHITECTURE</text>
  <line x1="48" y1="60" x2="1152" y2="60" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Column 1: Data Sources -->
  <g transform="translate(48 84)">
    <!-- Edge API Card -->
    <rect x="0" y="0" width="330" height="114" rx="14" fill="#141417" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="28" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">EDGE · /api/inspect</text>
    <text x="20" y="54" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Cloudflare Pages Functions</text>
    <text x="20" y="78" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">ipapi.is · ipwho.is 多源聚合</text>
    <text x="20" y="98" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ASN / Datacenter / Abuser / KV IP_CACHE</text>

    <!-- Client Probes Card -->
    <rect x="0" y="130" width="330" height="114" rx="14" fill="#141417" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="158" fill="#D4D4D8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">CLIENT · 7 BROWSER PROBES</text>
    <text x="20" y="184" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">浏览器侧实时探针</text>
    <text x="20" y="208" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">国内直连 · EDNS 泄露 · WebRTC ICE</text>
    <text x="20" y="228" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">IPv4/IPv6 · Anthropic Endpoints · TZ/Locale</text>
  </g>

  <!-- Connectors 1 -> 2 -->
  <path d="M378 141 H420 V192 H446" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  <path d="M378 271 H420 V220 H446" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  <circle cx="446" cy="192" r="3.5" fill="#10B981"/>
  <circle cx="446" cy="220" r="3.5" fill="#F4F4F6"/>

  <!-- Column 2: Risk Engine -->
  <g transform="translate(454 114)">
    <rect x="0" y="0" width="292" height="184" rx="16" fill="#19191D" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="22" y="32" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">SRC/ENGINE/RISKENGINE.TS</text>
    <text x="22" y="64" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">evaluateRisk()</text>
    <text x="22" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">五维加权风控评分引擎</text>
    <line x1="22" y1="110" x2="270" y2="110" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="22" y="134" fill="#D4D4D8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">• 100 分制健康度评级 (A–F)</text>
    <text x="22" y="158" fill="#D4D4D8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">• 逐项审计发现 + 修复优先级</text>
  </g>

  <!-- Connectors 2 -> 3 -->
  <path d="M746 176 H788 V136 H814" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  <path d="M746 206 H814" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  <path d="M746 236 H788 V276 H814" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>

  <!-- Column 3: Actionable Outputs -->
  <g transform="translate(822 84)">
    <rect x="0" y="0" width="330" height="72" rx="12" fill="#141417" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="28" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600">环境风控仪表盘与长图分享</text>
    <text x="18" y="52" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Scorecard · Findings · ShareReportModal</text>

    <rect x="0" y="86" width="330" height="72" rx="12" fill="#141417" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="114" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600">Claude Code CLI 环境变量建议</text>
    <text x="18" y="138" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">HTTP_PROXY · HTTPS_PROXY · NO_PROXY</text>

    <rect x="0" y="172" width="330" height="72" rx="12" fill="#141417" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="200" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600">一键复制 AI Agent 修复提示词</text>
    <text x="18" y="224" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">src/utils/agentPrompt.ts</text>
  </g>
</svg>
